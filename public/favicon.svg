<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0A0B0E"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#0071E3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <linearGradient id="coreDot" x1="200" y1="200" x2="312" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="10"/>
  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="196" fill="url(#coreGlow)"/>
  <!-- Outer Aperture Ring -->
  <circle cx="256" cy="256" r="158" stroke="url(#ring1)" stroke-width="18" stroke-opacity="0.42"/>
  <!-- Cardinal Focus Tick Marks -->
  <path d="M256 64V98M256 414V448M64 256H98M414 256H448" stroke="#93C5FD" stroke-width="16" stroke-linecap="round" stroke-opacity="0.72"/>
  <!-- Middle Liquid Glass Ring -->
  <circle cx="256" cy="256" r="104" stroke="#FFFFFF" stroke-width="20" stroke-opacity="0.88"/>
  <!-- Inner Singular Focus Core -->
  <circle cx="256" cy="256" r="46" fill="url(#coreDot)"/>
</svg>